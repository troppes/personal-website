name: Gitleaks

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # run once a day at 4 AM

jobs:
  scan:
    name: Scan repo for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
